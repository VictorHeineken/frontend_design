<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrosel</title>
    <style>

        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }

        .scene {
            margin: 80px auto;
            width: 210px;
            aspect-ratio: 4 / 5;
            position: relative;
            perspective: 1000px;

        }

        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;

        }

        .carousel>img {
            position: absolute;
            left: 0;
            top: 0;
            width: 190px;
            border-radius: 10px;
            aspect-ratio:  4 / 5;
            transform: rotateY(var(--i)) translateZ(288px);
        }

        @keyframes rotate {
            0% {
                transform: rotateY(360deg);
            }

            100% {transform: rotateY(0);

            }
        }

    </style>
</head>
<body>
    <div class="scene">
        <div class="carousel">
            <img style="--i:000deg" src="./images/1.jpg">
            <img style="--i:040deg" src="./images/2.jpg">
            <img style="--i:080deg" src="./images/3.jpg">
            <img style="--i:120deg" src="./images/4.jpg">
            <img style="--i:160deg" src="./images/5.jpg">
            <img style="--i:200deg" src="./images/6.jpg">
            <img style="--i:240deg" src="./images/7.jpg">
            <img style="--i:2800deg" src="./images/8.png">
            <img style="--i:3200deg" src="./images/9.jpg">
        </div>
    </div>
</body>
</html>
